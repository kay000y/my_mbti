<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 포켓몬 찾기</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #FFFDF0;
            --card-bg: #FFFFFF;
            --primary-yellow: #FFD23F;
            --primary-orange: #FF9F1C;
            --accent-soft: #FFF3C4;
            --text-main: #4A3E3D;
            --text-sub: #7A6B6B;
            --border-color: #FFE699;
            --shadow: 0 10px 25px rgba(230, 180, 50, 0.15);
            --shadow-hover: 0 14px 30px rgba(230, 180, 50, 0.25);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            line-height: 1.6;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* 헤더 스타일 */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .main-title {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            word-break: keep-all;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 500;
            word-break: keep-all;
        }

        /* 화면 전환 처리 */
        .screen {
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 카드 공통 스타일 */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: var(--shadow);
            border: 3px solid var(--border-color);
        }

        /* MBTI 그리드 레이아웃 */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .mbti-btn {
            background-color: #FFFDF5;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .mbti-btn:hover {
            transform: translateY(-4px);
            background-color: var(--accent-soft);
            border-color: var(--primary-yellow);
            box-shadow: 0 8px 15px rgba(255, 210, 63, 0.3);
        }

        .mbti-btn:active {
            transform: translateY(-1px);
        }

        .mbti-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #3A302F;
            letter-spacing: 0.5px;
        }

        .mbti-desc {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* 결과 화면 스타일 */
        .result-card {
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-soft);
            color: #B36B00;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .pokemon-emoji {
            font-size: 6.5rem;
            line-height: 1.1;
            margin: 10px 0 16px 0;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.08));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .pokemon-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .reason-box {
            background-color: #FFFDF5;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-bottom: 24px;
            border: 1.5px solid var(--border-color);
            font-size: 1.05rem;
            color: #4A3E3D;
            word-break: keep-all;
            line-height: 1.7;
        }

        .chemistry-box {
            background-color: #FFF9E6;
            border-radius: 16px;
            padding: 18px 20px;
            text-align: left;
            margin-bottom: 28px;
            border: 2px dashed #FFD23F;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .chemistry-emoji {
            font-size: 2.8rem;
            flex-shrink: 0;
        }

        .chemistry-info h4 {
            font-size: 1.05rem;
            color: #8A5200;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .chemistry-info p {
            font-size: 0.95rem;
            color: #5C4D4C;
            word-break: keep-all;
        }

        /* 버튼 스타일 */
        .btn-restart {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-yellow) 0%, var(--primary-orange) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 159, 28, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 159, 28, 0.45);
        }

        .btn-restart:active {
            transform: translateY(0);
        }

        /* 반응형 모바일 대응 */
        @media (max-width: 520px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .main-title {
                font-size: 1.75rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .card {
                padding: 20px 16px;
            }

            .pokemon-emoji {
                font-size: 5.2rem;
            }

            .pokemon-name {
                font-size: 1.8rem;
            }

            .chemistry-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .chemistry-emoji {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

        </header>

        <!-- 화면 1: MBTI 선택 화면 -->
        <main id="selection-screen" class="screen active">
            <div class="card">
                <div class="mbti-grid" id="mbti-grid">
                    <!-- JavaScript에서 16개 버튼을 동적으로 생성합니다 -->
                </div>
            </div>
        </main>

        <!-- 화면 2: 결과 화면 -->

                <div class="badge" id="result-badge">INFP - 내향형 상상가</div>

                    </p>
                </div>

                    </div>
                </div>

                <button class="btn-restart" id="btn-restart" onclick="resetToSelection()">
                    <span>🔄</span> 다시 고르기
                </button>
            </div>
        </main>
    </div>

                desc: "아이디어가 넘치는 아이디어상",
                reason: "놀라운 지능과 깊은 사색을 즐기는 후딘은 INTP의 전형입니다. 비논리적인 것을 배척하고 호기심 어린 눈으로 세상을 분석하여 독창적인 원리를 찾아냅니다.",
                chemistry: {
                    mbti: "ENTJ",
                    pokemon: "리자몽",
                    emoji: "🔥",
                    reason: "강한 추진력을 가진 리자몽이 후딘의 우수한 논리와 아이디어를 실천으로 옮겨줍니다."
                }
            },
            "ESTP": {
                name: "윈디",
                emoji: "🦁",
                desc: "수완 좋은 모험가",
                reason: "거침없는 속도감과 당찬 에너지를 지닌 윈디는 ESTP의 순발력을 연상시킵니다. 망설임 없이 현장에 몸을 던지는 담대함과 뛰어난 문제 해결 능력을 지녔습니다.",
                chemistry: {
                    mbti: "ISFJ",
                    pokemon: "해피너스",
                    emoji: "🥚",
                    reason: "세심하고 따뜻한 해피너스가 거침없이 달려나가는 윈디를 세심하게 보살펴주며 다독여줍니다."
                }
            }
        };

        // 페이지 로드 시 MBTI 버튼 동적 생성
        window.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('mbti-grid');
            
            Object.keys(mbtiData).forEach(mbti => {
                const btn = document.createElement('button');
                btn.className = 'mbti-btn';
                btn.setAttribute('aria-label', `${mbti} 선택하기`);
                btn.onclick = () => selectMBTI(mbti);

                btn.innerHTML = `
                    <span class="mbti-title">${mbti}</span>
                    <span class="mbti-desc">${mbtiData[mbti].desc}</span>
                `;

                grid.appendChild(btn);
            });
        });

        // MBTI 선택 시 결과 화면 출력
        function selectMBTI(mbti) {
            const data = mbtiData[mbti];
            if (!data) return;

            // 내용 채우기
            document.getElementById('result-badge').innerText = `${mbti} - ${data.desc}`;
            document.getElementById('pokemon-emoji').innerText = data.emoji;
            document.getElementById('pokemon-name').innerText = data.name;
            document.getElementById('pokemon-reason').innerText = data.reason;

            // 궁합 채우기
            document.getElementById('chem-emoji').innerText = data.chemistry.emoji;
            document.getElementById('chem-text').innerHTML = `<strong>${data.chemistry.mbti} (${data.chemistry.pokemon})</strong> : ${data.chemistry.reason}`;

            // 화면 전환 애니메이션
            const selectionScreen = document.getElementById('selection-screen');
            const resultScreen = document.getElementById('result-screen');

            selectionScreen.classList.remove('active');
            
            setTimeout(() => {
                resultScreen.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        }

        // 다시 고르기 (선택 화면으로 리셋)
        function resetToSelection() {
            const selectionScreen = document.getElementById('selection-screen');
            const resultScreen = document.getElementById('result-screen');

            resultScreen.classList.remove('active');

            setTimeout(() => {
                selectionScreen.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        }
    </script>
</body>
</html>
